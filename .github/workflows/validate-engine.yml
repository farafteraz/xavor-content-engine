name: Validate provider routing
on:
  push:
    branches: [v2-strategy-engine]
    paths:
      - 'llm/**'
      - 'run.py'
      - 'tests/**'
      - 'scripts/check_providers.py'
      - 'requirements.txt'
      - '.github/workflows/validate-engine.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Check provider access with tiny requests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STRATEGY_MODEL: gpt-5.6-sol
          DRAFTING_MODEL: claude-opus-4-8
          STRATEGY_REASONING_EFFORT: low
        run: python scripts/check_providers.py
